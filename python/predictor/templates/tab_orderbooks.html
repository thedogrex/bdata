  <!-- ============ TAB: ORDER BOOKS ============ -->
  <div id="panel-orderbooks" class="hidden">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

      <!-- Left: Market selector -->
      <div class="card p-6 lg:col-span-1">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-lg font-semibold">Select Market</h2>
          <div class="flex gap-2">
            <button id="ob-markets-prev" onclick="obMarketsPrevPage()" class="btn btn-slate text-xs">Prev</button>
            <button id="ob-markets-next" onclick="obMarketsNextPage()" class="btn btn-slate text-xs">Next</button>
          </div>
        </div>
        <div id="ob-markets-page" class="text-xs text-slate-500 mb-2"></div>
        <div id="ob-market-list" class="text-sm text-slate-400">Loading...</div>
      </div>

      <!-- Right: Snapshot viewer -->
      <div class="card p-6 lg:col-span-2">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold">Order Book Snapshots</h2>
          <div class="flex gap-2">
            <button onclick="obSetMode('live')" id="ob-mode-live" class="btn btn-green text-xs">Live</button>
            <button onclick="obSetMode('history')" id="ob-mode-history" class="btn btn-slate text-xs">History</button>
          </div>
        </div>

        <div id="ob-market-info" class="text-xs text-slate-400 mb-3">Select a market to view snapshots.</div>

        <!-- Live mode: auto-updating latest snapshot -->
        <div id="ob-live-panel">
          <div class="flex items-center justify-between mb-2">
            <div class="text-xs text-slate-400">Auto-updating latest snapshot (asks only — instant buy prices)</div>
            <div id="ob-live-status" class="text-xs text-green-400"></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <h4 class="text-sm font-semibold text-green-400 mb-2">UP — 5 Lowest Asks</h4>
              <div id="ob-live-up" class="text-xs text-slate-400">Select a market.</div>
            </div>
            <div>
              <h4 class="text-sm font-semibold text-red-400 mb-2">DOWN — 5 Lowest Asks</h4>
              <div id="ob-live-down" class="text-xs text-slate-400">Select a market.</div>
            </div>
          </div>
        </div>

        <!-- History mode: snapshot browser -->
        <div id="ob-history-panel" class="hidden">
          <!-- Filters -->
          <div class="flex gap-2 items-end mb-3 flex-wrap">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Show</label>
              <select id="ob-hist-side" class="w-48">
                <option value="BOTH">BOTH</option>
                <option value="UP">UP</option>
                <option value="DOWN">DOWN</option>
              </select>
            </div>
            <button onclick="obLoadHistory()" class="btn btn-primary text-xs">Load</button>
          </div>

          <!-- Sub-tabs: Chart / Table -->
          <div class="flex gap-2 mb-3">
            <button onclick="obSetHistView('chart')" id="ob-histview-chart" class="btn btn-green text-xs">Chart</button>
            <button onclick="obSetHistView('table')" id="ob-histview-table" class="btn btn-slate text-xs">Table</button>
          </div>

          <!-- Chart view -->
          <div id="ob-hist-chart-panel">
            <div id="ob-chart-container" style="width:100%;overflow-x:auto;position:relative;">
              <canvas id="ob-chart-canvas" style="height:320px;"></canvas>
            </div>
            <div id="ob-chart-tooltip" style="display:none;position:fixed;background:#1e293b;border:1px solid #475569;border-radius:6px;padding:8px 12px;font-size:11px;color:#e2e8f0;pointer-events:none;z-index:9999;max-width:280px;"></div>
          </div>

          <!-- Table view -->
          <div id="ob-hist-table-panel" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <!-- Snapshot list -->
              <div>
                <div class="flex items-center justify-between mb-2">
                  <h4 class="text-sm font-semibold">Snapshots</h4>
                  <div class="flex gap-2">
                    <button id="ob-hist-prev" onclick="obHistPrevPage()" class="btn btn-slate text-xs">Prev</button>
                    <button id="ob-hist-next" onclick="obHistNextPage()" class="btn btn-slate text-xs">Next</button>
                  </div>
                </div>
                <div id="ob-hist-page" class="text-xs text-slate-500 mb-2"></div>
                <div id="ob-hist-list" class="max-h-96 overflow-y-auto text-xs text-slate-400">No data.</div>
              </div>
              <!-- Snapshot detail -->
              <div>
                <h4 class="text-sm font-semibold mb-2">Snapshot Detail</h4>
                <div id="ob-hist-detail" class="text-xs text-slate-400">Click a snapshot to view.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

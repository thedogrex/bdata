<div id="panel-wallet" class="hidden">
  <div class="card p-6 mb-6">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-lg font-semibold">Wallet</h2>
        <p class="text-xs text-slate-400">Live trading status and balances.</p>
      </div>
      <button onclick="loadWallet()" class="btn btn-slate text-xs">Reload</button>
    </div>

    <div id="wallet-balance" class="inline-flex flex-col gap-1 p-3 rounded-lg" style="background:#0b1220;border:1px solid #334155;min-width:220px;max-width:320px">
      <div class="text-[11px] uppercase tracking-wide text-slate-400">Balance / Allowance</div>
      <div class="text-[10px] text-slate-500">Balance (USDC)</div>
      <div class="text-lg font-semibold text-emerald-400">Loading...</div>
    </div>
  </div>

  <div class="card p-6">
    <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between mb-4">
      <div>
        <h3 class="text-base font-semibold">Order Flow Analytics</h3>
        <p class="text-[11px] text-slate-400">Track wins, losses, and net winnings by day for any period.</p>
      </div>
      <div class="flex flex-wrap gap-3 items-end">
        <label class="text-[10px] uppercase tracking-wide text-slate-500 flex flex-col gap-1">
          From
          <input type="date" id="wallet-analytics-from" class="input input-slate text-xs px-2 py-1" />
        </label>
        <label class="text-[10px] uppercase tracking-wide text-slate-500 flex flex-col gap-1">
          To
          <input type="date" id="wallet-analytics-to" class="input input-slate text-xs px-2 py-1" />
        </label>
        <label class="text-[10px] uppercase tracking-wide text-slate-500 flex flex-col gap-1">
          Fee %
          <input type="number" id="wallet-analytics-fee" value="1.8" step="0.1" min="0" class="input input-slate text-xs px-2 py-1" />
        </label>
        <button type="button" class="btn btn-slate text-xs" onclick="loadWalletAnalytics()">Apply</button>
      </div>
    </div>

    <div class="flex flex-wrap gap-2 mb-3 text-[11px]">
      <button type="button" class="px-3 py-1 rounded bg-slate-800 text-slate-200 hover:bg-slate-700" onclick="walletSetAnalyticsPreset(1)">Today</button>
      <button type="button" class="px-3 py-1 rounded bg-slate-800 text-slate-200 hover:bg-slate-700" onclick="walletSetAnalyticsPreset(2)">Last 2d</button>
      <button type="button" class="px-3 py-1 rounded bg-slate-800 text-slate-200 hover:bg-slate-700" onclick="walletSetAnalyticsPreset(7)">Last 7d</button>
    </div>

    <div id="wallet-analytics-error" class="hidden text-[11px] text-rose-300"></div>
    <div id="wallet-analytics-summary" class="text-xs text-slate-300">Loading...</div>
    <div id="wallet-analytics-table" class="mt-4 overflow-auto text-xs text-slate-200"></div>
  </div>
</div>

<div id="panel-wallet" class="hidden">
  <div class="card p-6 mb-6">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-lg font-semibold">Wallet</h2>
        <p class="text-xs text-slate-400">Live trading status, balances, and recent orders.</p>
      </div>
      <button onclick="loadWallet()" class="btn btn-slate text-xs">Reload</button>
    </div>

    <div class="flex flex-col lg:flex-row items-start gap-6">
      <div id="wallet-balance" class="inline-flex flex-col gap-1 p-3 rounded-lg" style="background:#0b1220;border:1px solid #334155;min-width:180px;max-width:220px">
        <div class="text-[11px] uppercase tracking-wide text-slate-400">Balance / Allowance</div>
        <div class="text-[10px] text-slate-500">Balance (USDC)</div>
        <div class="text-lg font-semibold text-emerald-400">Loading...</div>
      </div>

      <div class="flex-1 w-full">
        <div class="text-xs text-slate-400 mb-2">Recent Orders</div>
        <div id="wallet-orders" class="text-xs text-slate-300">Loading...</div>
      </div>
    </div>
  </div>
</div>

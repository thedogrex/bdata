  <!-- ============ TAB: POLY BATCH ============ -->
  <div id="panel-poly_batch" class="hidden">
    <div class="grid grid-cols-1 xl:grid-cols-4 gap-4">
      <div class="card p-6 xl:col-span-1">
        <h2 class="text-lg font-semibold mb-4">Run Batch Predictions</h2>
        <label class="block text-xs text-slate-400 mb-2">Markets to process</label>
        <input type="number" id="poly-batch-limit" class="w-full mb-3" value="20" min="1" max="200" placeholder="20">

        <label class="block text-xs text-slate-400 mb-2">Source table</label>
        <select id="poly-batch-table" class="w-full mb-3">
          <option value="c_5m">c_5m (default)</option>
          <option value="c_5m_8s">c_5m_8s (early)</option>
          <option value="c_5m_5s">c_5m_5s</option>
        </select>

        <button onclick="polyBatchRun()" class="btn btn-primary w-full flex items-center justify-center gap-2">
          <span>⚡</span>
          <span>Run predictions</span>
        </button>
        <div id="poly-batch-status" class="text-xs text-slate-400 mt-3"></div>

        <hr class="my-4 border-slate-700">

        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-semibold">Filters</h3>
          <button onclick="polyBatchClearFilter()" class="text-xs text-blue-400">Reset</button>
        </div>
        <div class="flex flex-wrap gap-2" id="poly-batch-filter-buttons">
          <button class="btn btn-slate text-xs" data-filter="ALL" onclick="polyBatchSetFilter('ALL')">All</button>
          <button class="btn btn-slate text-xs" data-filter="UP" onclick="polyBatchSetFilter('UP')">UP</button>
          <button class="btn btn-slate text-xs" data-filter="DOWN" onclick="polyBatchSetFilter('DOWN')">DOWN</button>
          <button class="btn btn-slate text-xs" data-filter="UNDEFINED" onclick="polyBatchSetFilter('UNDEFINED')">Undefined</button>
          <button class="btn btn-slate text-xs" data-filter="ERROR" onclick="polyBatchSetFilter('ERROR')">Error</button>
        </div>
      </div>

      <div class="xl:col-span-3 flex flex-col gap-4">
        <div class="card p-4">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-lg font-semibold">Recent Predictions</h2>
            <div id="poly-batch-summary" class="text-xs text-slate-400"></div>
          </div>
          <div id="poly-batch-updated" class="text-xs text-slate-500 mb-2"></div>
          <div id="poly-batch-results" class="space-y-3 text-sm"></div>
        </div>
      </div>
    </div>
  </div>

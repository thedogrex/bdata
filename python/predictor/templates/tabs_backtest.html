  <!-- ============ TAB: BACKTEST ============ -->
  <div id="panel-backtest">
    <div class="card p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">Run Moving-Window Backtest</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 items-start">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Strategy <span class="tooltip cursor-help text-blue-400" id="bt-strategy-info">&#9432;<span class="tt"></span></span></label>
          <select id="bt-strategy" class="w-full"></select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400 mb-1">Backtest Config (JSON) <span class="tooltip cursor-help text-blue-400" id="bt-params-info">&#9432;<span class="tt"></span></span></label>
          <textarea id="bt-config" rows="10" class="w-full mt-1 text-xs font-mono"></textarea>
          <div class="flex gap-2 mt-1" id="bt-presets"></div>
        </div>
      </div>
      <div id="strategy-desc" class="mt-2 text-xs text-slate-500 italic"></div>
      <div id="strategy-ref" class="hidden mt-3 p-3 rounded-lg text-xs" style="background:#0f172a;border:1px solid #334155"></div>
      <button onclick="runBacktest()" id="btn-run" class="btn btn-green mt-4">Run Backtest</button>
    </div>
    <div id="bt-results" class="hidden"></div>
  </div>

  <!-- ============ TAB: COMPARE ============ -->
  <div id="panel-compare" class="hidden">
    <div class="card p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">Compare All Strategies</h2>
      <div class="grid grid-cols-1 gap-4 mb-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Compare Config (JSON)</label>
          <textarea id="cmp-config" rows="8" class="w-full text-xs font-mono"></textarea>
        </div>
      </div>
      <button onclick="runCompare()" id="btn-compare" class="btn btn-green">Compare All</button>
    </div>
    <div id="cmp-results" class="hidden"></div>
  </div>

  <!-- ============ TAB: BRUTE FORCE ============ -->
  <div id="panel-bruteforce" class="hidden">
    <div class="card p-6 mb-6">
      <h2 class="text-lg font-semibold mb-4">Brute-Force Hyperparameter Search</h2>
      <div class="mt-2">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Strategy <span class="tooltip cursor-help text-blue-400" id="bf-strategy-info">&#9432;<span class="tt"></span></span></label>
            <select id="bf-strategy" class="w-full"></select>
            <label class="block text-xs text-slate-400 mt-4 mb-1" for="bf-horizon">Horizon</label>
            <input type="number" id="bf-horizon" value="1" min="1" max="5" class="w-full" />
            <p class="text-[11px] text-slate-500 mt-1">Used for every brute-force backtest run.</p>
            <label class="block text-xs text-slate-400 mt-4 mb-1" for="bf-processes">Processes</label>
            <input type="number" id="bf-processes" value="6" min="1" max="32" class="w-full" />
            <p class="text-[11px] text-slate-500 mt-1">Higher values fan out combos in parallel.</p>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs text-slate-400 mb-1">Bruteforce Config (JSON) — <button onclick="loadDefaultGrid()" class="text-blue-400 underline text-xs">Load Default</button> <span class="tooltip cursor-help text-blue-400" id="bf-grid-info">&#9432;<span class="tt"></span></span></label>
            <textarea id="bf-grid" rows="10" class="w-full text-xs font-mono"></textarea>
            <div id="bf-combos" class="text-xs text-slate-400 mt-1"></div>
          </div>
        </div>
      </div>
      <button onclick="runBruteforce()" id="btn-bf" class="btn btn-purple mt-4">Queue Brute Force</button>
    </div>
    <div class="card p-6"><h3 class="font-semibold mb-3">Brute-Force Sessions (DB)</h3><div id="bf-sessions"></div></div>
  </div>

  <!-- ============ TAB: HISTORY ============ -->
  <div id="panel-history" class="hidden">
    <div class="card p-6 mb-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div><label class="block text-xs text-slate-400 mb-1" for="hist-strategy">Strategy</label><select id="hist-strategy" class="w-full"><option value="">All</option></select></div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="hist-horizons">Horizons</label>
          <input type="hidden" id="hist-horizons" value="1,2,3" />
          <div class="inline-flex rounded-lg overflow-hidden" style="border:1px solid #334155;background:#0f172a">
            <button onclick="histToggleHorizon(1)" id="hist-h1" class="px-3 py-2 text-xs font-semibold" style="background:#052e16;color:#22c55e">H1</button>
            <button onclick="histToggleHorizon(2)" id="hist-h2" class="px-3 py-2 text-xs font-semibold" style="background:#052e16;color:#22c55e">H2</button>
            <button onclick="histToggleHorizon(3)" id="hist-h3" class="px-3 py-2 text-xs font-semibold" style="background:#052e16;color:#22c55e">H3</button>
          </div>
        </div>
        <div><label class="block text-xs text-slate-400 mb-1" for="hist-min-acc">Min Accuracy %</label><input type="number" id="hist-min-acc" value="" placeholder="53" class="w-20"></div>
        <div><label class="block text-xs text-slate-400 mb-1" for="hist-limit">Limit</label><input type="number" id="hist-limit" value="50" class="w-full"></div>
        <div class="flex items-end gap-2">
          <button onclick="loadHistory()" class="btn btn-primary">Search</button>
          <button onclick="clearAllHistory()" class="btn btn-red">Clear All</button>
        </div>
      </div>
    </div>
    <div id="history-list"></div>
  </div>

  <!-- ============ TAB: BEST ============ -->
  <div id="panel-best" class="hidden">
    <div class="card p-6 mb-4">
      <div class="flex gap-4 items-end flex-wrap">
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="best-horizon">Horizon</label>
          <input type="number" id="best-horizon" value="1" min="1" max="5" class="w-32">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="best-limit">Limit</label>
          <input type="number" id="best-limit" value="20" class="w-32">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="best-bf-session">BF Session</label>
          <select id="best-bf-session" class="w-44 text-xs">
            <option value="">All sessions</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="best-signals-min">Signals from</label>
          <input type="number" id="best-signals-min" placeholder="0" class="w-32">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="best-signals-max">Signals to</label>
          <input type="number" id="best-signals-max" placeholder="∞" class="w-32">
        </div>
        <button onclick="loadBest()" class="btn btn-amber">Load Best</button>
        <div style="border-left:1px solid #475569;height:32px;margin:0 4px"></div>
        <button onclick="bestToggleCompareMode()" id="best-compare-toggle" class="btn btn-slate">Compare Mode</button>
        <button onclick="bestRunCompare()" id="best-compare-btn" class="btn btn-purple hidden">Compare Selected (<span id="best-compare-count">0</span>)</button>
      </div>
    </div>
    <div id="best-list"></div>
  </div>

  <!-- ============ TAB: BEST COMPARE ============ -->
  <div id="panel-best_compare" class="hidden">
    <div class="card p-6 mb-4">
      <div class="flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-4">
          <button onclick="bestCompareGoBack()" id="bc-back-btn" class="btn btn-slate">&larr; Back to Best Runs</button>
          <h2 class="text-lg font-semibold">Half-Kelly Strategy Comparison</h2>
        </div>
        <div class="flex gap-4 items-end flex-wrap">
          <div><label class="block text-xs text-slate-400 mb-1" for="bc-bank">Starting Bank ($)</label><input type="number" id="bc-bank" value="1000" min="1" class="w-32" onchange="bestCompareRecalc()"></div>
          <div><label class="block text-xs text-slate-400 mb-1" for="bc-buy-price">Buy Price (¢)</label><input type="number" id="bc-buy-price" value="52" min="1" max="99" step="0.5" class="w-32" onchange="bestCompareRecalc()" title="Share buy price in cents (win pays $1.00)"></div>
          <div><label class="block text-xs text-slate-400 mb-1" for="bc-max-bet">Max Bet ($)</label><input type="number" id="bc-max-bet" value="500" min="1" class="w-32" onchange="bestCompareRecalc()" title="Maximum stake per signal"></div>
          <div><label class="block text-xs text-slate-400 mb-1" for="bc-hkpct">½ Kelly % (bank)</label><input type="number" id="bc-hkpct" value="1.70" min="0" step="0.01" class="w-32" onchange="bestCompareRecalc()" title="Percent of current bank to stake per signal"></div>
          <div><label class="block text-xs text-slate-400 mb-1" for="bc-fkpct">Full Kelly % (bank)</label><input type="number" id="bc-fkpct" value="3.34" min="0" step="0.01" class="w-32" onchange="bestCompareRecalc()" title="Percent of current bank to stake per signal"></div>
          <div><label class="block text-xs text-slate-400 mb-1" for="bc-fee">Fee (%)</label><input type="number" id="bc-fee" value="1.56" min="0" step="0.01" class="w-32" onchange="bestCompareRecalc()" title="Fee charged per bet (percent of stake)"></div>
          <button onclick="bestCompareRecalc()" class="btn btn-purple">Recalculate</button>
        </div>
      </div>
    </div>
    <div id="bc-chart" class="card p-6 mb-4" style="min-height:300px"></div>
    <div id="bc-table" class="card p-6 mb-4"></div>
    <div id="bc-chart-full" class="card p-6 mb-4" style="min-height:300px"></div>
    <div id="bc-table-full" class="card p-6 mb-4"></div>
    <div id="bc-summary" class="card p-6 mb-4"></div>
  </div>

  <!-- ============ MODAL: BF PROFIT FINDER ============ -->
  <div id="bf-profit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60" onclick="if(event.target===this)bfCloseProfitModal()">
    <div class="bg-slate-900 rounded-lg p-6 w-full max-w-4xl mx-4 max-h-[90vh] overflow-auto border border-slate-700">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h3 class="text-lg font-semibold">Bruteforce Profit Finder</h3>
          <div id="bf-profit-label" class="text-xs text-slate-400 mt-1">Select a bruteforce session to begin.</div>
        </div>
        <button onclick="bfCloseProfitModal()" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mt-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="bf-profit-horizon">Horizon</label>
          <input type="number" id="bf-profit-horizon" class="w-full" min="1" max="5" value="1">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="bf-profit-bank">Starting Bank ($)</label>
          <input type="number" id="bf-profit-bank" class="w-full" value="1000" min="10" step="10">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="bf-profit-buy">Share Buy Price (¢)</label>
          <input type="number" id="bf-profit-buy" class="w-full" value="52" min="1" max="99" step="0.5">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="bf-profit-maxbet">Max Bet ($)</label>
          <input type="number" id="bf-profit-maxbet" class="w-full" value="500" min="1" step="1">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="bf-profit-betpct">Bet % of Bank (½ Kelly)</label>
          <input type="number" id="bf-profit-betpct" class="w-full" value="1.70" min="0" max="20" step="0.05">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="bf-profit-fee">Fee per Bet (%)</label>
          <input type="number" id="bf-profit-fee" class="w-full" value="1.56" min="0" max="10" step="0.05">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" for="bf-profit-monthly">Min Accuracy Per Month (%)</label>
          <input type="number" id="bf-profit-monthly" class="w-full" placeholder="51" min="0" max="100" step="0.5">
        </div>
      </div>
      <div class="flex items-center gap-3 flex-wrap mt-4">
        <button id="bf-profit-run-btn" onclick="bfRunProfitFinder()" class="btn btn-purple">Analyze Profit</button>
        <button onclick="bfClearProfitResults()" class="btn btn-slate text-sm">Reset</button>
        <div id="bf-profit-meta" class="text-xs text-slate-400"></div>
      </div>
      <div id="bf-profit-results" class="mt-4 text-sm text-slate-300"></div>
    </div>
  </div>

  <!-- ============ TAB: ORDERS MARKET PRICING ============ -->
  <div id="panel-order_pricing" class="hidden">
    <div class="card p-6 mb-4">
      <h2 class="text-lg font-semibold mb-2">Orders Market Pricing</h2>
      <p class="text-xs text-slate-400 mb-4">Analyses correctly predicted markets: what % had the ask price draw down to your limit order price during the market window.</p>

      <!-- Filters -->
      <div class="flex flex-wrap gap-4 items-end">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Date From</label>
          <input type="date" id="omp-date-from" class="w-40">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Date To</label>
          <input type="date" id="omp-date-to" class="w-40">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Quick</label>
          <div class="flex gap-2">
            <button onclick="ompSetLastDays(1)" class="btn btn-slate text-xs">1 day</button>
            <button onclick="ompSetLastDays(7)" class="btn btn-slate text-xs">7 days</button>
            <button onclick="ompSetLastDays(14)" class="btn btn-slate text-xs">14 days</button>
            <button onclick="ompSetLastDays(30)" class="btn btn-slate text-xs">30 days</button>
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Price Threshold (cents)</label>
          <input type="number" id="omp-threshold" value="52" min="40" max="60" step="0.5" class="w-24">
        </div>
        <button onclick="ompLoad()" class="btn btn-purple text-xs">Analyse</button>
      </div>
      <p class="text-[11px] text-slate-500 mt-4">Profit model: each filled order buys $1 worth of shares at the best ask. Winning fills return <code>(1 / price) - 1</code> USD; losing fills lose $1.</p>
    </div>

    <!-- Summary cards -->
    <div id="omp-summary" class="grid gap-4 mb-4" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"></div>

    <!-- Histogram -->
    <div id="omp-histogram" class="card p-6 mb-4"></div>

    <!-- Per-day breakdown -->
    <div id="omp-per-day" class="card p-6 mb-4"></div>

    <!-- Markets detail table -->
    <div id="omp-markets" class="card p-6 mb-4"></div>
  </div>
